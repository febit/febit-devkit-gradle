import java.time.Instant

plugins {
  alias libs.plugins.lombok
  alias libs.plugins.spotless apply false
}

group = 'org.febit.devkit.gradle'
version = '1.7.0'

ext {
}

allprojects {
  apply plugin: 'com.diffplug.spotless'

  group = rootProject.group
  version = rootProject.version

  repositories {
    mavenCentral()
  }

  spotless {
    java {
      target 'src/*/java/**/*.java'
      licenseHeaderFile rootProject.file('etc/license-header.txt')

      endWithNewline()
      trimTrailingWhitespace()

      shortenFullyQualifiedTypes()

      cleanthat()
          .addMutator('SafeAndConsensual')
          .addMutator('PMD')
          .addMutator('Stream')
          .addMutator('SpotBugs')

      removeUnusedImports()
      importOrder(
          '',
          'org.febit',
          'lombok|org.jspecify',
          'jakarta|java|javax',
          '\\#', '\\#jakarta|\\#java|\\#javax'
      )

      tableTestFormatter()
    }
  }

  tasks.check.dependsOn tasks.named('spotlessCheck')
}

def javaLibModules() {
  subprojects.findAll {
    !it.name.endsWith('-bom')
  }
}

def LIBS = libs

configure(javaLibModules()) {
  apply plugin: 'java-library'
  apply plugin: 'io.freefair.lombok'

  apply from: "${rootDir}/gradle/publish-maven.gradle"

  java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17

    withJavadocJar()
    withSourcesJar()
  }

  tasks.withType(Test).configureEach {
    testLogging.events = ["FAILED", "PASSED", "SKIPPED", "STANDARD_OUT", "STANDARD_ERROR"]
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.debug = true
    options.compilerArgs << "-Xlint:unchecked"
    options.compilerArgs << "-Xlint:deprecation"
  }

  tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
  }

  tasks.withType(Jar).configureEach {
    manifest {
      attributes([
          "Build-Jdk"               : System.getProperty("java.version"),
          "Build-Jdk-Spec"          : java.targetCompatibility.toString(),
          "Build-Time"              : Instant.ofEpochSecond(System.currentTimeMillis() / 1000 as long).toString(),
          "Created-By"              : "Gradle " + project.getGradle().getGradleVersion(),
          "Implementation-Title"    : project.getName(),
          "Implementation-Vendor-Id": project.getGroup().toString(),
          "Implementation-Version"  : project.getVersion().toString()
      ])
    }
  }

  test {
    useJUnitPlatform()
  }

  dependencies {
    compileOnly LIBS.jsr305
    compileOnly LIBS.spotbugs.annotations

    testCompileOnly LIBS.jsr305
    testCompileOnly LIBS.spotbugs.annotations
    testImplementation LIBS.slf4j.api
    testImplementation LIBS.jupiter.api
    testImplementation LIBS.jupiter.params
    testImplementation LIBS.tabletest.junit
    testImplementation LIBS.mockito.junit.jupiter
    testRuntimeOnly LIBS.jupiter.engine
    testRuntimeOnly LIBS.junit.platform.launcher
  }
}
